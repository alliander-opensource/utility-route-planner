name: CI
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Run pre-commit
        shell: bash
        run: |
          poetry install
          poetry run pre-commit run --all-files
